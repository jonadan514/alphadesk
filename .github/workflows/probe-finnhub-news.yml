name: Probe Finnhub News

# 미국 뉴스 축 대체안(테마 소속 기업 뉴스 건수 합)을 Finnhub로 실측한다(진단용, DB는 읽기만).
on:
  workflow_dispatch:
    inputs:
      themes:
        description: "테마 ID 공백 구분"
        required: false
        default: "nuclear_smr power_grid defense"
      weeks:
        description: "몇 주"
        required: false
        default: "8"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/probe_finnhub_news.py --themes ${{ inputs.themes }} --weeks ${{ inputs.weeks }}
