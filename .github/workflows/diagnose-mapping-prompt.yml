name: Diagnose Mapping Prompt

# 테마 매핑이 유니버스 안의 명백한 후보를 놓치는 원인을 A/B로 가린다.
# 진단용 - 결과를 DB에 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      themes:
        description: "테마 ID 공백 구분 (비우면 medical_device specialty_gas datacenter_cooling)"
        required: false
        default: ""

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Diagnose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/diagnose_mapping_prompt.py --themes ${{ inputs.themes }}
