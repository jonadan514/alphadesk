name: Audit Mapping Evidence

# 테마 매핑 근거를 실제 사업정보와 대조한다(consistent/contradicts/unverifiable).
# 진단용 - DB에 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "특정 run_id (비우면 현재 화면에 표시 중인 승인분)"
        required: false
        default: ""
      market:
        description: "KR 또는 US"
        required: false
        default: "KR"
      eval_labels:
        description: "정답지 JSON 경로 (비우면 평가 생략)"
        required: false
        default: ""

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # 매핑 run과 같은 유니버스·프로필을 봐야 한다. CI에서 매핑 중 새로 받은 프로필은
      # 저장소에 커밋되지 않으므로, 여기서 복원·보충하지 않으면 신규 상장 종목이
      # "사업정보 없음"으로 오판된다(2026-09-15 엠앤씨솔루션 484870 사례).
      - name: Restore KR universe cache
        uses: actions/cache@v4
        with:
          path: data/kr_universe.json
          key: kr-universe-audit-${{ github.run_id }}
          restore-keys: |
            kr-universe-theme-
            kr-universe-

      - name: Fill missing KR profiles
        continue-on-error: true
        run: python scripts/fetch_kr_profiles.py --only-missing

      - name: Audit
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          RID="${{ inputs.run_id }}"
          MK="${{ inputs.market || 'KR' }}"
          EV="${{ inputs.eval_labels }}"
          EXTRA=()
          [ -n "$EV" ] && EXTRA+=(--eval "$EV")
          if [ -n "$RID" ]; then
            python scripts/audit_mapping_evidence.py --run-id "$RID" --market "$MK" "${EXTRA[@]}"
          else
            python scripts/audit_mapping_evidence.py --current-approved --market "$MK" "${EXTRA[@]}"
          fi

      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-audit
          path: out/evidence_audit_*
          if-no-files-found: warn
