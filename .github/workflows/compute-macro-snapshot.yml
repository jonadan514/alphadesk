name: Compute Macro Snapshot

on:
  schedule:
    # 매일 22:30 UTC (미국 정규장 마감 이후) - 주말엔 그냥 금요일 종가가 그대로 나옴
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install yfinance pandas
      - env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: python -m src.analyzers.macro_snapshot
