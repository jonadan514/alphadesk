name: Probe Growth FCF Data

# 성장률·FCF Yield를 만들 데이터가 실제로 있는지 실측한다. 읽기만 하고 아무것도 쓰지 않는다.
# MASTER_PLAN Phase C 항목을 설계하기 전에 전제를 확인하는 용도
# (probe-krx-sector-index.yml과 같은 성격 - 제안보다 실측이 먼저).
#
# 가볍다: fundamentals_cache와 quarterly_financials_raw를 읽어 개수만 센다.
# 외부 수집(야후·DART)은 하지 않는다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/probe_growth_fcf_data.py
      - name: Probe growth distribution
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/probe_growth_distribution.py
