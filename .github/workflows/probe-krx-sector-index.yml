name: Probe KRX Sector Index

# KRX 공식 업종지수를 섹터 분석에 쓸 수 있는지 실측한다. 읽기만 하고 DB에 쓰지 않는다.
#
# 로컬에서 돌릴 수 없어서 워크플로로 둔다 - pykrx 1.2.8은 KRX 로그인을 요구하는데
# 자격증명이 Secrets에만 있다(probe-kr-universe-source.yml과 같은 사정).
on:
  workflow_dispatch:
    inputs:
      probe_date:
        description: "조회 기준일 YYYYMMDD (비우면 최근 영업일 추정)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # pykrx 1.2.8은 pandas<3.0을 요구하는데 이 저장소는 pandas 3.x다. 같은 환경에
      # 두면 pip이 에러 대신 pykrx를 1.0.51로 조용히 낮춘다(로그인 기능이 없는
      # 버전 -> 모든 조회 실패). 격리 venv에 깔아 그 안에서만 돌린다.
      - name: Probe in isolated pykrx venv
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PROBE_DATE: ${{ inputs.probe_date }}
          PROBE_OUT: /tmp/krx_sector_index.json
          PYTHONUNBUFFERED: "1"
        run: |
          python -m venv /tmp/krxenv
          /tmp/krxenv/bin/pip install --quiet "pandas<3.0" "pykrx==1.2.8"
          /tmp/krxenv/bin/python -c "import pykrx,pandas;print('pykrx',getattr(pykrx,'__version__','?'),'pandas',pandas.__version__)"
          /tmp/krxenv/bin/python scripts/probe_krx_sector_index.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-sector-index-json
          path: /tmp/krx_sector_index.json
          if-no-files-found: warn
