name: Normalize Theme Evidence

on:
  workflow_dispatch:

jobs:
  normalize:
    name: Normalize evidence language
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Normalize
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/normalize_theme_evidence.py
