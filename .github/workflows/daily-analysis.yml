name: Daily Analysis

on:
  schedule:
    # 미국 장 마감 후: 월~금 22:00 UTC → 화~토 07:00 KST 도착 (토요일 아침 = 금요일 미국 마감 분석)
    - cron: '0 22 * * 1-5'
    # 한국 장 마감 후: 월~금 07:30 UTC = 같은 날 16:30 KST (주의: KST 16:30은 같은 UTC 날짜 — 밀지 말 것)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:           # 수동 실행 (모든 잡 실행)

env:
  TURSO_DATA_URL:      ${{ secrets.TURSO_DATA_URL }}
  TURSO_DATA_TOKEN:    ${{ secrets.TURSO_DATA_TOKEN }}
  FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
  FINNHUB_API_KEY:     ${{ secrets.FINNHUB_API_KEY }}
  OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
  PERPLEXITY_API_KEY:  ${{ secrets.PERPLEXITY_API_KEY }}
  TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 선택 — 미설정 시 알림만 건너뜀
  TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

# 크론별로 해당 시장만 실행 (이전엔 매 크론마다 양쪽을 다 돌려 AI 비용·시간 2배)
jobs:
  us-analysis:
    name: US Market Analysis
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt libsql-experimental
      - name: Run US analysis
        run: python scripts/run_integrated_analysis.py

  kr-analysis:
    name: KR Market Analysis
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt libsql-experimental
      - name: Run KR analysis
        run: python scripts/run_kr_analysis.py

  narratives:
    name: Watchlist Narratives
    # 하루 1회(아침 실행)면 충분 — 20시간 신선도 체크가 있어 어차피 중복 생성 안 됨
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install requests yfinance python-dotenv
      - name: Generate narrative briefs
        run: python scripts/generate_narratives.py

  telegram-digest:
    name: Telegram Digest
    needs: [us-analysis, kr-analysis, narratives]
    if: always()   # 상위 작업이 스킵/실패해도 최신 데이터로 알림 시도 (아침·오후 각 1회 발송)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install requests yfinance
      - name: Send Telegram digest
        run: python scripts/send_telegram_digest.py
