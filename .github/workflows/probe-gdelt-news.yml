name: Probe GDELT News

# 미국 뉴스 대체 출처(GDELT DOC API)를 Actions에서 실측한다(진단용, DB 안 씀).
on:
  workflow_dispatch:
    inputs:
      themes:
        description: "테마 ID 공백 구분"
        required: false
        default: "ai_semiconductor nuclear_smr power_grid glp1_obesity defense"
      weeks:
        description: "몇 주"
        required: false
        default: "8"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/probe_gdelt_news.py --themes ${{ inputs.themes }} --weeks ${{ inputs.weeks }}
