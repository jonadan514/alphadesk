name: Diagnose US Chunk Size

# 미국 매핑에서 청크 크기·사업정보 첨부가 누락에 주는 영향을 본다. 진단용 - DB에 쓰지 않는다.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Diagnose
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/diagnose_us_chunk_size.py 2>&1 | grep -v "청크 .* 완료"
