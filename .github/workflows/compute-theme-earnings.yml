name: Compute Theme Earnings

on:
  schedule:
    - cron: "15 22 * * 0"   # 뉴스 수집(22:00)과 살짝 겹치지 않게 15분 뒤 - SPEC §7
  workflow_dispatch:
    inputs:
      week_start:
        description: "기준 주 월요일 YYYY-MM-DD (비우면 오늘이 속한 주)"
        required: false
        default: ""
    inputs:
      theme_id:
        description: "테마 ID 공백 구분 (비우면 전체)"
        required: false
        default: ""
      include_peripheral:
        description: "linkage=peripheral도 포함할지"
        required: false
        type: boolean
        default: false

jobs:
  compute:
    name: Compute earnings axis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: >
          python scripts/compute_theme_earnings.py --week-start "${{ inputs.week_start }}"
          --theme-id ${{ inputs.theme_id }}
          ${{ inputs.include_peripheral == 'true' && '--include-peripheral' || '' }}
