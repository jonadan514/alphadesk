name: Theme Company Mapping

on:
  workflow_dispatch:
    inputs:
      theme_ids:
        # 빈 값을 넘겨도 GitHub이 default를 적용하므로 "비우면 전체"는 동작하지
        # 않는다(2026-09-09 확인 — 전체 실행 의도로 ""를 넘겼는데 파일럿 3개만
        # 돌았다). 전체 실행은 명시적으로 ALL을 넘긴다.
        description: "테마 ID 공백 구분. 전체 33개를 돌리려면 ALL 입력"
        required: false
        default: "nuclear_smr physical_ai shipbuilding"

jobs:
  map:
    name: Map theme companies
    runs-on: ubuntu-latest
    # 전체 33테마 = 330 OpenAI 호출(테마당 경로A 4청크x2회 + 경로B + 비평).
    # 60분으로는 전체 실행이 아슬아슬해서 여유를 뒀다 - 배치로 쪼개면 run_id가
    # 나뉘어 승인을 여러 번 해야 하므로 한 번에 도는 쪽을 택했다.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 테마 매핑의 경로 A는 유니버스 안에서만 고르므로, 스크리닝과 같은
      # 유니버스를 써야 한다. 이 파일이 없으면 정적 212종목으로 폴백해
      # 새로 넓힌 487종목이 매핑 후보에서 통째로 빠진다.
      - name: Restore KR universe cache
        uses: actions/cache@v4
        with:
          path: data/kr_universe.json
          key: kr-universe-theme-${{ github.run_id }}
          restore-keys: |
            kr-universe-theme-
            kr-universe-

      - name: Fetch KR universe (isolated pykrx)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m venv /tmp/krxenv
          /tmp/krxenv/bin/pip install --quiet "pandas<3.0" "pykrx==1.2.8"
          /tmp/krxenv/bin/python scripts/fetch_kr_universe_pykrx.py --out data/kr_universe.json

      - name: Run theme mapping
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          IDS="${{ inputs.theme_ids }}"
          if [ "$IDS" = "ALL" ]; then IDS=""; fi
          python scripts/map_theme_companies.py --theme-id $IDS
