name: Fix Zero News Weeks

# 수집 실패로 정수 0이 저장된 주를 NULL로 되돌린다(일회성 정리, 멱등).
# 기본값은 dry_run=true - 무엇이 바뀌는지 로그로 먼저 본다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 바꾸지 않고 대상만 출력"
        required: false
        default: "true"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fix
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=()
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          python scripts/fix_zero_news_weeks.py "${ARGS[@]}"
