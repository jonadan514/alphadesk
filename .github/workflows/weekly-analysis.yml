name: Weekly Market Analysis

on:
  schedule:
    # 매주 월요일 22:00 UTC (화요일 07:00 KST) — 전날(일요일) 워치리스트 스크리닝 이후,
    # 그 주의 신규 후보를 포트폴리오 매수에 반영할 수 있도록 하루 텀을 둔다.
    - cron: '0 22 * * 1'
  workflow_dispatch:           # 수동 실행 (모든 잡 실행)

env:
  TURSO_DATA_URL:      ${{ secrets.TURSO_DATA_URL }}
  TURSO_DATA_TOKEN:    ${{ secrets.TURSO_DATA_TOKEN }}
  FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
  FINNHUB_API_KEY:     ${{ secrets.FINNHUB_API_KEY }}
  OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
  PERPLEXITY_API_KEY:  ${{ secrets.PERPLEXITY_API_KEY }}
  TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 선택 — 미설정 시 알림만 건너뜀
  TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

# 종목별 AI 요약(비용이 드는 부분)은 이제 주간 워치리스트 스크리닝 쪽(narratives 잡)으로
# 옮겨갔으므로, 여기서는 US/KR을 같은 크론에서 동시에 실행해도 비용 부담이 없다.
jobs:
  us-analysis:
    name: US Market Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run US analysis
        run: python scripts/run_integrated_analysis.py

  kr-analysis:
    name: KR Market Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run KR analysis
        run: python scripts/run_kr_analysis.py

  telegram-digest:
    name: Telegram Digest
    needs: [us-analysis, kr-analysis]
    if: always()   # 상위 작업이 스킵/실패해도 최신 데이터로 알림 시도
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install requests yfinance
      - name: Send Telegram digest
        run: python scripts/send_telegram_digest.py

  notify-failure:
    name: Notify on Failure
    needs: [us-analysis, kr-analysis, telegram-digest]
    if: failure()   # needs 잡 중 하나라도 실패하면 실행 (스킵된 잡은 실패로 안 침)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Send failure notification
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: >-
            us-analysis=${{ needs['us-analysis'].result }},
            kr-analysis=${{ needs['kr-analysis'].result }},
            telegram-digest=${{ needs['telegram-digest'].result }}
        run: python scripts/notify_failure.py
