name: Debug Quarterly Revenue

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "티커 공백 구분"
        required: false
        default: "TSLA"

jobs:
  debug:
    name: Debug
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: python scripts/debug_quarterly_revenue.py ${{ inputs.tickers }}
