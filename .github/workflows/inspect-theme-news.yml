name: Inspect Theme News

# 분기 재설계 점검용. 읽기만 한다 - 수집 코드·데이터를 건드리지 않는다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "articles(6-1 기사 현황) / quarterly(6-3 분기 뉴스 비율과 기준값 분포)"
        required: true
        default: "quarterly"
      quarter:
        description: "quarterly 모드에서 볼 분기 (예: 2026Q3, 비우면 직전 분기)"
        required: false
        default: ""

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          case "${{ inputs.mode }}" in
            articles)  python scripts/inspect_theme_news.py ;;
            quarterly)
              if [ -n "${{ inputs.quarter }}" ]; then
                python scripts/report_quarterly_news.py --quarter "${{ inputs.quarter }}"
              else
                python scripts/report_quarterly_news.py
              fi ;;
            *) echo "알 수 없는 mode"; exit 1 ;;
          esac
