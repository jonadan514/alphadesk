name: Inspect Quarterly Company Signals

# 분기 재설계 점검용. quarterly_company_signals를 읽기만 한다 - 아무것도 쓰지 않는다.
on:
  workflow_dispatch:
    inputs:
      quarter:
        description: "대상 분기 (예: 2026Q3)"
        required: true
      market:
        description: "KR / US (비우면 둘 다)"
        required: false
        default: ""
      theme_id:
        description: "테마 ID 공백 구분 (비우면 시장마다 승인된 테마 중 표본 3개)"
        required: false
        default: ""

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/inspect_quarterly_company_signals.py --quarter "${{ inputs.quarter }}" \
            ${{ inputs.market && format('--market {0}', inputs.market) || '' }} \
            ${{ inputs.theme_id && format('--theme-id {0}', inputs.theme_id) || '' }}
