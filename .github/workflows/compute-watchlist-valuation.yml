name: Compute Watchlist Valuation

# 워치리스트 후보의 PSR/PER/밸류 등급을 채운다.
#
# 평소엔 이 워크플로를 돌릴 필요가 없다 - weekly-watchlist.yml이 스크리닝 직후
# 같은 계산을 이어서 하기 때문이다(run_watchlist_screen.py 4-1단계). 이건 주간
# 스크리닝을 기다리지 않고 지금 채워 넣거나, 분기 재무를 새로 수집한 뒤 값만
# 다시 계산하고 싶을 때 쓰는 수동 실행용이다.
#
# 가볍다: watchlist_candidates와 quarterly_financials_raw를 읽어 계산만 하고
# UPDATE를 배치로 보낸다. 야후/DART 같은 외부 수집은 하지 않는다.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "KR / US (비우면 둘 다)"
        required: false
        default: ""

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compute
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/compute_watchlist_valuation.py \
            ${{ inputs.market && format('--market {0}', inputs.market) || '' }}
