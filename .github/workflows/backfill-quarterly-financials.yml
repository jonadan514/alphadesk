name: Backfill Quarterly Financials

# 테마 소속 + 워치리스트 종목의 분기 재무제표(fundamentals_cache income_quarterly) 갱신.
# 2026-10-09부터 매주 토요일 자동 실행 - 일요일 밤 실적 축(compute-theme-earnings)과
# 워치리스트 밸류·분기 이익률 계산이 새 분기 실적을 쓰게 하려고. 최신 분기가 이미 있는 종목은
# 스크립트가 건너뛰어 실적 시즌이 아니면 금방 끝난다.
on:
  schedule:
    - cron: "0 21 * * 6"   # 매주 토요일 21:00 UTC (일요일 06:00 KST)
  workflow_dispatch:
    inputs:
      scope:
        description: "all(테마+워치리스트) / themes(테마 소속만)"
        required: false
        default: "all"
      force:
        description: "true면 최신 분기가 있어도 다시 조회"
        required: false
        default: "false"

jobs:
  backfill:
    name: Backfill quarterly financials
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
        run: |
          args="--scope ${{ inputs.scope || 'all' }}"
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          python scripts/backfill_quarterly_financials.py $args
