name: Weekly Watchlist Screen

on:
  schedule:
    - cron: "0 22 * * 0"   # 매주 일요일 22:00 UTC (월요일 07:00 KST)
  workflow_dispatch:         # 수동 실행
    inputs:
      market:
        description: "US | KR | ALL (비우면 ALL)"
        required: false
        default: ""
      refresh_budget:
        description: "이번 실행에서 라이브 갱신할 종목 수 (비우면 60)"
        required: false
        default: ""
      only_screen:
        # 스크리닝만 여러 번 돌려야 할 때가 있다(REFRESH_BUDGET이 60이라
        # 유니버스가 커지면 한 번에 다 못 갱신한다). 그때 내러티브·브리핑까지
        # 같이 돌면 LLM 비용이 들고 예정에 없던 텔레그램 브리핑이 발송된다.
        description: "true면 스크리닝만 실행(내러티브·브리핑 건너뜀)"
        required: false
        default: ""

jobs:
  screen:
    runs-on: ubuntu-latest
    # KR 유니버스가 정적 87종목 → 전체 KOSPI+KOSDAQ(2000억+, 약 수백~천 종목)로
    # 늘어나며 yfinance 시가총액 사전조회 단계가 추가돼 소요 시간이 늘어남
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pykrx pandas requests

      # 종목코드<->회사명 짝 검사. 차단하지 않는다(continue-on-error) —
      # 위키 접속 실패나 지수 정기변경에 따른 사명 변경으로 스크리닝 전체가
      # 멈추면 안 된다. 불일치가 있으면 잡에 노란 경고로 표시된다.
      - name: Audit KR universe names
        continue-on-error: true
        run: python scripts/audit_kr_universe.py --no-yfinance

      - name: Run watchlist screening
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          # 공공데이터포털 "금융위원회_KRX상장종목정보" 서비스키 (무료·자동승인).
          # https://www.data.go.kr/data/15094775/openapi.do 에서 발급.
          # 없으면 pykrx로 재시도 후, 그마저 실패하면 KOSPI 대형주 정적 리스트로 폴백.
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          # SPEC §6.3 — 캐시 적중률 저하·rate limit 회로차단기 작동 시 경고 발송용.
          # 미설정이면 조용히 건너뜀(파이프라인 안 막음).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 특정 시장만 전량 강제 갱신해야 할 때 수동 실행에서 올린다
          # (예: 거래소 접미사 수정 후 캐시에 남은 잘못된 값을 걷어낼 때).
          REFRESH_BUDGET: ${{ inputs.refresh_budget }}
        run: python scripts/run_watchlist_screen.py --market "${{ inputs.market || 'ALL' }}"

      - name: Upload data.db artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-db
          path: output/data.db
          retention-days: 7

  narratives:
    name: Watchlist Narratives
    needs: [screen]
    # always()는 유지 - 스크리닝 일부 실패해도 이미 있는 후보 목록 기준으로
    # 갱신 시도. only_screen일 때만 건너뛴다(예약 실행은 inputs가 비어 있어 통과).
    if: always() && inputs.only_screen != 'true' 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install requests yfinance python-dotenv
      - name: Generate narrative briefs
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_narratives.py

  briefing:
    name: Weekly Briefing
    needs: [screen, narratives]
    # 위와 동일 - only_screen이면 텔레그램 브리핑을 보내지 않는다.
    if: always() && inputs.only_screen != 'true' 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install requests yfinance pyyaml
      - name: Generate weekly briefing
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/generate_weekly_briefing.py

  notify-failure:
    name: Notify on Failure
    needs: [screen, narratives, briefing]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Send failure notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: >-
            screen=${{ needs.screen.result }},
            narratives=${{ needs.narratives.result }},
            briefing=${{ needs.briefing.result }}
        run: python scripts/notify_failure.py
