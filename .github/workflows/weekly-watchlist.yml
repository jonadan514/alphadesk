name: Weekly Watchlist Screen

on:
  schedule:
    - cron: "0 22 * * 0"   # 매주 일요일 22:00 UTC (월요일 07:00 KST)
  workflow_dispatch:         # 수동 실행

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pykrx pandas

      - name: Run watchlist screening
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          # data.krx.co.kr 계정 (선택) — 없으면 KR은 KOSPI 대형주 정적 리스트로 폴백
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/run_watchlist_screen.py --market ALL

      - name: Upload data.db artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-db
          path: output/data.db
          retention-days: 7

  narratives:
    name: Watchlist Narratives
    needs: [screen]
    if: always()   # 스크리닝 일부 실패해도 이미 있는 후보 목록 기준으로 갱신 시도
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install requests yfinance python-dotenv
      - name: Generate narrative briefs
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_narratives.py

  briefing:
    name: Weekly Briefing
    needs: [screen, narratives]
    if: always()   # 스크리닝/네러티브 일부 실패해도 가능한 데이터로 브리핑 생성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install requests yfinance
      - name: Generate weekly briefing
        env:
          TURSO_DATA_URL: ${{ secrets.TURSO_DATA_URL }}
          TURSO_DATA_TOKEN: ${{ secrets.TURSO_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/generate_weekly_briefing.py

  notify-failure:
    name: Notify on Failure
    needs: [screen, narratives, briefing]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Send failure notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: >-
            screen=${{ needs.screen.result }},
            narratives=${{ needs.narratives.result }},
            briefing=${{ needs.briefing.result }}
        run: python scripts/notify_failure.py
