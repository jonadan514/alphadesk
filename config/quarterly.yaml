# 분기 4칸 분류 기준값 (docs/REDESIGN_SPEC.md 7장)
#
# 주간 시스템의 기준값(config/themes.yaml의 news_thresholds 등)과 별개다. 분기 구조는
# 다른 계산식을 쓰므로 같은 숫자를 돌려쓰지 않는다.
#
# **이 값을 임의로 바꾸지 않는다**(CLAUDE.md 원칙 3). 바꿀 때는 근거가 될 분포를 먼저
# 측정한다: `python scripts/report_quarterly_news.py --quarter <분기>`

news_high:
  # 뉴스 "많음" 기준 - 이번 분기 주당 평균 ÷ 직전 4분기 주당 평균 (6-3)
  #
  # 시장마다 값이 다른 이유. 2026-09-22에 2026Q3(11주 진행)로 처음 실측했더니 같은
  # 계산식인데도 분포가 한쪽으로 치우쳐 있었다.
  #
  #            비율 중앙값   1.5배 이상
  #   한국        1.55       31개 중 19개 (61%)
  #   미국        1.11       29개 중  9개 (31%)
  #
  # 기준값 하나를 양쪽에 쓰면 한국은 대부분 "많음", 미국은 대부분 "적음"이 된다.
  # 그래서 각 시장 분포의 상위 30% 언저리에서 값을 잡았다(둘 다 9개 테마).
  #
  # **왜 매 분기 상위 30%를 다시 계산하지 않나.** 그러면 항상 정확히 30%가 "많음"이 되어,
  # 시장 전체가 조용해진 분기를 구분할 수 없다. 값을 고정해야 "이번 분기는 전반적으로
  # 잠잠하다"가 결과에 나타난다.
  #
  # **아직 잠정값이다.** 근거가 한 분기뿐이고 그마저 11/13주만 모인 상태였다. 치우침의
  # 원인도 확정하지 못했다 - 기사가 많은 테마일수록 비율이 1에 눌리는 경향이 있어
  # (구글 뉴스 100건 상한 의심) 미국이 더 눌렸을 수 있지만, 한국 뉴스가 실제로 늘어난
  # 것일 수도 있다. 첫 분기 실행 뒤 다시 본다(SPEC 11장).
  KR: 1.75
  US: 1.50
  default: 1.50      # 시장이 위에 없을 때

financial_on:
  # 재무 신호 "켜짐" 기준 (7-1). 시장 공통이다.
  change_ratio: 0.30     # 변화 기업 비율 30% 이상
  min_changed: 2         # 그리고 변화 기업 2곳 이상
  min_judged: 2          # 판정 가능 기업이 이보다 적으면 데이터부족
